name: Recipe sync

on:
  schedule:
    - cron: '17 1,7,13,19 * * *' -- Every 6 hours at 17 minutes past the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recipe-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Sync recipes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ingest/sync.py
